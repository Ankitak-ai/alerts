<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyperChat Audio — Macdaking</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
  </style>
</head>
<body>
<script>
(function () {
  'use strict';

  const AUDIO_ENDPOINT = 'https://vsevsjvtrshgeiudrnth.supabase.co/functions/v1/get-current-audio';
  const OBS_TOKEN = 'obs_tfan5bkyt2hse6870aked';
  const POLL_INTERVAL_MS = 4000;

  let isPlaying = false;

  function checkForAudio() {
    if (isPlaying) return;

    const audio = new Audio(
      AUDIO_ENDPOINT + '?token=' + encodeURIComponent(OBS_TOKEN) + '&t=' + Date.now()
    );

    audio.oncanplaythrough = function () {
      isPlaying = true;
      audio.play().catch(function (err) {
        console.error('[HyperChat Audio] Play failed:', err);
        isPlaying = false;
      });
    };

    audio.onended = function () {
      console.log('[HyperChat Audio] Playback ended.');
      isPlaying = false;
    };

    audio.onerror = function () {
      isPlaying = false;
    };

    audio.load();
  }

  setInterval(checkForAudio, POLL_INTERVAL_MS);
  checkForAudio();

  console.log('[HyperChat Audio] Loaded. Polling every ' + POLL_INTERVAL_MS + 'ms.');
})();
</script>
</body>
</html>
